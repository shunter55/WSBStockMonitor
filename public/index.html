<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WSB Stock Monitor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0e11;
      color: #e6edf3;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
    }
    a, button {
      background: #58a6ff;
      border: none;
      border-radius: 8px;
      color: #0b0e11;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      text-decoration: none;
    }
    a:hover, button:hover { filter: brightness(1.1); }
    p { color: #8b949e; max-width: 32rem; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>WSB Stock Monitor</h1>
  <p>Generate a fresh report from Reddit and/or Gemini. The first load may take 1–3 minutes on Vercel.</p>
  <a href="/api/run">View latest report</a>
  <a href="/api/run?reddit_only=1" style="background:#21262d;color:#e6edf3;">Reddit only</a>
  <a href="/api/run?gemini_only=1" style="background:#21262d;color:#e6edf3;">Gemini only</a>
</body>
</html>
