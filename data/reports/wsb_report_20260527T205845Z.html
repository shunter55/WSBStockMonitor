<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WSB Stock Monitor — wallstreetbets</title>
  <style>
    :root {
      --bg: #0b0e11;
      --card: #161b22;
      --text: #e6edf3;
      --muted: #8b949e;
      --bull: #3fb950;
      --bear: #f85149;
      --accent: #58a6ff;
      --border: #30363d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1.5rem;
    }
    header {
      max-width: 960px;
      margin: 0 auto 2rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.75rem; }
    .meta { color: var(--muted); font-size: 0.95rem; }
    .source-block {
      max-width: 960px;
      margin: 0 auto 2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .source-block h2 {
      margin: 0;
      padding: 1rem 1.25rem;
      font-size: 1.1rem;
      background: #21262d;
      border-bottom: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.65rem 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }
    .ticker { font-weight: 700; color: var(--accent); }
    .bull { color: var(--bull); }
    .bear { color: var(--bear); }
    .stats { padding: 0.75rem 1.25rem; color: var(--muted); font-size: 0.85rem; }
    footer {
      max-width: 960px;
      margin: 2rem auto 0;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>r/wallstreetbets — WSB Stock Monitor</h1>
    <p class="meta">Generated 2026-05-27T12:00:00+00:00 · 48h window</p>
  </header>
  
  <section class="source-block">
    <h2>REDDIT — Top 10</h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Ticker</th>
          <th>Mentions</th>
          <th>Bullish</th>
          <th>Bearish</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>#1</td><td class="ticker">GME</td><td>mentions: 42</td><td class="bull">60%</td><td class="bear">40%</td></tr>
      </tbody>
    </table>
    <p class="stats">Scanned 100 posts, 0 comments (reddit_public_json)</p>
  </section>

  <footer>WSB Stock Monitor</footer>
</body>
</html>
